# Watch news sources.
#
# feed_url: RSS/Atom feed to parse (preferred). Leave blank/omit to fall back
#           to generic HTML scraping of `homepage`.
# max_initial: cap on how many of a brand-new source's most recent entries
#              get summarized the first time it's ever seen (avoids a huge
#              first digest / API bill).

- name: Hodinkee
  homepage: https://www.hodinkee.com/
  feed_url: https://www.hodinkee.com/articles
  max_initial: 10

