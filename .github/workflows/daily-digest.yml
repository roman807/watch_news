name: Daily Watch News Digest

on:
  schedule:
    # 16:58 CET (UTC+1) -- used roughly late Oct through late Mar.
    # 2 minutes before the hour on purpose: GitHub's scheduler is most
    # likely to delay runs queued for exactly the top of the hour.
    - cron: '58 15 * * *'
    # 16:58 CEST (UTC+2) -- used roughly late Mar through late Oct
    - cron: '58 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this cron entry matches the current CET/CEST offset
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Match on which cron *expression* fired (fixed at schedule-definition
          # time) rather than the current wall-clock hour — GitHub Actions
          # schedules can be delayed by hours, and by execution time the hour
          # may no longer match the intended slot even though this is still
          # the correct, DST-appropriate firing for today.
          offset=$(TZ="Europe/Berlin" date +%z)
          schedule="${{ github.event.schedule }}"
          should_run=false
          if [ "$offset" = "+0100" ] && [ "$schedule" = "58 15 * * *" ]; then should_run=true; fi
          if [ "$offset" = "+0200" ] && [ "$schedule" = "58 14 * * *" ]; then should_run=true; fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run digest and publish to docs/
        if: steps.gate.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m watch_news.main --publish-dir docs

      - name: Commit and push updates
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.db docs/
          git diff --cached --quiet || git commit -m "Daily watch news digest for $(date -u +%F)"
          git push
